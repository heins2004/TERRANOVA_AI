<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TERRANOVA AI – Public projects across India</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;700&display=swap">
<style>
:root{--bg:#0a0e17;--ink:#e8f1fa;--mu:#8b9bb0;--cy:#22d3ee;--vi:#3b82f6;--gl:rgba(30,58,110,.40);--ed:rgba(120,180,255,.20);--ok:#34d399;--no:#fb7185;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#eef3f9;--ink:#0a0e17;--mu:#51607a;--cy:#0e7490;--vi:#2563eb;--gl:rgba(255,255,255,.72);--ed:rgba(10,14,23,.14);--ok:#047857;--no:#be123c;color-scheme:light}}
:root[data-theme=light]{--bg:#eef3f9;--ink:#0a0e17;--mu:#51607a;--cy:#0e7490;--vi:#2563eb;--gl:rgba(255,255,255,.72);--ed:rgba(10,14,23,.14);--ok:#047857;--no:#be123c;color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(100px);opacity:.4;z-index:0;pointer-events:none}
body:before{background:var(--vi);top:-28vmax;left:-18vmax}body:after{background:var(--cy);bottom:-34vmax;right:-22vmax}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
:root[data-theme=light] #stars{display:none}
@media(prefers-color-scheme:light){:root:not([data-theme=dark]) #stars{display:none}}
button{font:inherit;color:inherit;cursor:pointer}
header{position:relative;z-index:5;display:flex;gap:12px;align-items:center;padding:18px clamp(16px,4vw,48px)}
.logo{font-weight:700;letter-spacing:.04em;white-space:nowrap}
.search{flex:1;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:0 18px;height:46px;border-radius:999px;background:var(--gl);border:1px solid var(--ed);backdrop-filter:blur(18px)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--ink);font:inherit;font-size:14px}
.search:focus-within{border-color:var(--cy);box-shadow:0 0 0 3px color-mix(in srgb,var(--cy) 25%,transparent)}
.btn{height:46px;padding:0 22px;border-radius:999px;border:1px solid var(--cy);background:color-mix(in srgb,var(--cy) 14%,transparent);backdrop-filter:blur(14px)}
.btn:hover,.btn:focus-visible{background:color-mix(in srgb,var(--cy) 30%,transparent);outline:0}
.ib{width:46px;height:46px;padding:0;border-radius:50%;border:1px solid var(--ed);background:var(--gl);position:relative}
.ib:hover,.ib:focus-visible{border-color:var(--cy);outline:0}
.dot{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:50%;background:var(--no)}
.me{display:flex;gap:8px;align-items:center}.me[hidden],.guest[hidden]{display:none}.guest{display:flex;gap:8px}
.wrap{position:relative;z-index:1;padding:0 clamp(16px,4vw,48px) 48px;max-width:1596px;margin:0 auto}
h1{font-weight:300;font-size:clamp(22px,3vw,34px);margin:6px 0 4px}
.strip{display:flex;flex-wrap:wrap;gap:6px 22px;color:var(--mu);font-size:13px;margin-bottom:16px}.strip b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.chip,.seg button{font-size:13px;padding:7px 14px;border-radius:999px;border:1px solid var(--ed);background:var(--gl)}
.chip[aria-pressed=true],.seg button[aria-pressed=true]{border-color:var(--cy);background:color-mix(in srgb,var(--cy) 22%,transparent)}
.seg{display:flex;gap:6px;margin-left:auto}select{font:inherit;font-size:13px;color:var(--ink);background:var(--gl);border:1px solid var(--ed);border-radius:999px;padding:7px 12px}
select option{color:#0a0e17}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(190px,auto);gap:16px;perspective:1400px;transform-style:preserve-3d}
.card{position:relative;border-radius:16px;padding:16px;text-align:left;background:linear-gradient(145deg,var(--gl),transparent);border:1px solid var(--ed);backdrop-filter:blur(20px) saturate(140%);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;gap:6px;transition:transform 2s cubic-bezier(.45,0,.2,1),scale .3s,opacity 1.4s,border-color .2s,box-shadow .2s;cursor:pointer}
.card:hover,.card:focus-visible{border-color:var(--cy);outline:0;box-shadow:0 0 26px -8px var(--cy)}
@media(hover:hover){.card:hover{scale:1.03;z-index:2}}
.art{position:absolute;inset:0;z-index:-1;opacity:.9}
.card h3{margin:0;font-size:17px;font-weight:700}.card p{margin:0;font-size:13px;color:var(--mu)}
.tag{position:absolute;top:12px;left:14px;font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--ed);background:color-mix(in srgb,var(--bg) 60%,transparent)}
.fol{position:absolute;top:10px;right:12px;font-size:12px;padding:4px 12px;border-radius:999px;border:1px solid var(--vi);background:color-mix(in srgb,var(--vi) 16%,transparent)}
.fol[aria-pressed=true]{background:var(--vi);color:#fff}
.meta{display:flex;justify-content:space-between;font-size:12px;color:var(--mu);font-variant-numeric:tabular-nums}
.sb{display:flex;height:6px;border-radius:6px;overflow:hidden;gap:2px;margin:4px 0}.sb i{display:block;min-width:3px}
.su{background:var(--ok)}.co{background:var(--no)}.ne{background:var(--mu)}
.big{grid-column:span 2;grid-row:span 2;padding:22px}.big svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.empty{grid-column:1/-1;padding:28px;color:var(--mu);border:1px dashed var(--ed);border-radius:16px}
.fly .card{pointer-events:none}
.view{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle,color-mix(in srgb,var(--bg) 25%,transparent),color-mix(in srgb,var(--bg) 85%,transparent))}
.view.on{display:flex}
.panel{width:min(1000px,100%);max-height:100%;overflow:auto;border-radius:20px;padding:26px;background:color-mix(in srgb,var(--bg) 90%,var(--vi));border:1px solid var(--ed);backdrop-filter:blur(30px);box-shadow:0 40px 100px -30px #000,0 0 50px -24px var(--cy)}
.panel h2{margin:0 0 4px;font-weight:300;font-size:clamp(24px,3vw,36px)}.sub{color:var(--mu);margin:0 0 18px;font-size:14px}
.close{float:right;width:40px;height:40px;border-radius:50%;border:1px solid var(--ed);background:var(--gl)}
.close:hover,.close:focus-visible{border-color:var(--cy);outline:0}
.trk{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 16px}.trk li{flex:1;padding:8px 10px;font-size:12px;text-align:center;border-radius:10px;border:1px solid var(--ed);color:var(--mu)}
.trk .dn{color:var(--ink);border-color:var(--ok)}.trk .on{color:var(--ink);border-color:var(--cy);background:color-mix(in srgb,var(--cy) 18%,transparent)}
.halt{padding:12px 14px;border:1px solid var(--no);border-radius:10px;margin-bottom:16px;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-bottom:16px}.stat{padding:2px 14px;border-left:1px solid var(--ed)}.stat:first-child{padding-left:0;border:0}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--mu)}
.sec{padding:16px;margin-bottom:14px;border-radius:12px;border:1px solid var(--ed);background:var(--gl)}.sec h4{margin:0 0 10px;font-size:13px;font-weight:500;color:var(--mu)}
.lg{display:flex;gap:16px;font-size:12px;color:var(--mu);flex-wrap:wrap}
.mp{width:100%;max-height:52vh;border-radius:12px;background:var(--gl);border:1px solid var(--ed);display:block}.mp .in{fill:color-mix(in srgb,var(--cy) 12%,transparent);stroke:var(--cy);stroke-width:1.5}
.mp.sat{background:#0b2a2f}.mp.sat .in{fill:#1d4d3a;stroke:#6ee7b7}.mp text{fill:var(--ink);font-size:10px}.mp.sat text{fill:#e8f1fa}
.pin{cursor:pointer}.pin:hover circle.d,.pin:focus circle.d{r:8}
.cm{padding:10px 0;border-top:1px solid var(--ed);font-size:14px}.cm:first-of-type{border:0}.cm small{color:var(--mu)}.rp{margin:8px 0 0 18px;padding-left:12px;border-left:2px solid var(--cy)}
.bd{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--cy);margin-left:6px}.bd.pl{border-color:var(--vi)}
.field{display:block;width:100%;margin:8px 0;min-height:46px;border-radius:12px;border:1px solid var(--ed);background:var(--gl);color:var(--ink);padding:10px 14px;font:inherit}
.err{color:var(--no);font-size:13px;min-height:18px;margin:4px 0}
.tabs{display:flex;gap:8px;margin-bottom:10px}.note{font-size:12px;color:var(--mu);margin-top:10px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.logo{display:none}.seg{margin-left:0}}
@media(max-width:560px){header{flex-wrap:wrap}.search{order:5;flex-basis:100%;max-width:none}.stats{grid-template-columns:1fr}.stat{padding:8px 0;border:0}.trk{flex-direction:column}.big{grid-column:span 2}}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<header>
  <div class="logo">TERRANOVA AI</div>
  <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search a city, area or project" aria-label="Search a city, area or project"></label>
  <button class="ib" id="th" aria-label="Switch light or dark theme">◐</button>
  <div class="guest" id="guest"><button class="btn" data-act="login">Log in</button></div>
  <div class="me" id="me" hidden><button class="ib" data-act="msgs" aria-label="Messages">✉<span class="dot"></span></button><button class="btn" data-act="out">Anita · Log out</button></div>
</header>
<div class="wrap">
  <h1>Public projects across India</h1>
  <div class="strip" id="strip"></div>
  <div class="bar" id="bar"></div>
  <div class="grid" id="grid"></div>
  <p class="note">Demo data for design review. Project names, numbers and comments are invented.</p>
</div>
<div class="view" id="view" role="dialog" aria-modal="true"></div>
<script>
const D=[
{n:"Marine Drive Link Road",city:"Kochi",cat:"Road",cr:186,days:21,s:[212,64,48],st:0,lat:9.98,lng:76.28,h:190,d:"A four-lane link road along the backwaters with a cycle track and two pedestrian crossings."},
{n:"District Hospital Wing",city:"Kochi",cat:"Hospital",cr:92,days:34,s:[301,22,40],st:0,lat:9.93,lng:76.27,h:160,d:"A 200-bed wing with a trauma unit and a covered ambulance bay."},
{n:"Whitefield Skywalk and Bus Bay",city:"Bengaluru",cat:"Road",cr:240,days:12,s:[140,190,60],st:0,lat:12.97,lng:77.75,h:250,d:"An elevated walkway linking the metro station to a new bus interchange."},
{n:"Government Model School Block",city:"Pune",cat:"School",cr:38,days:45,s:[160,8,20],st:0,lat:18.52,lng:73.85,h:210,d:"Twenty classrooms, two labs and a playground on municipal land."},
{n:"Sports Complex Annex",city:"Hyderabad",cat:"Stadium",cr:410,days:9,s:[120,150,70],st:0,lat:17.38,lng:78.48,h:280,d:"A 15,000-seat indoor arena beside the existing stadium."},
{n:"Riverside Retail Quarter",city:"Ahmedabad",cat:"Mall",cr:530,days:28,s:[90,170,44],st:0,lat:23.02,lng:72.57,h:300,d:"A walkable retail district on the river edge, with a flood-safe podium."},
{n:"Outer Ring Road Phase 2",city:"Delhi",cat:"Road",cr:1250,days:17,s:[260,330,90],st:0,lat:28.61,lng:77.2,h:170,d:"A 24 km ring road section with six interchanges."},
{n:"Community Clinic",city:"Mumbai",cat:"Hospital",cr:24,days:52,s:[75,6,18],st:0,lat:19.07,lng:72.88,h:150,d:"A primary-care clinic with maternal and child health services."},
{n:"Riverfront Walkway",city:"Chennai",cat:"Park",cr:64,days:0,s:[180,40,30],st:1,lat:13.03,lng:80.26,h:140,d:"A 3 km riverside walkway with native planting."},
{n:"Bypass Junction Upgrade",city:"Kochi",cat:"Road",cr:78,days:0,s:[310,25,60],st:2,lat:10.1,lng:76.35,h:200,d:"A grade-separated junction that replaced a signal-controlled crossing."},
{n:"Mall Redevelopment",city:"Mumbai",cat:"Mall",cr:320,days:0,s:[88,210,35],st:3,lat:19.07,lng:72.88,h:320,why:"The owning official halted this project pending a fresh environmental review.",d:"Redevelopment of an ageing mall into a mixed-use block."}];
const OUT=[[74,37],[77,35.5],[79,34],[78,32.5],[80,30.5],[84,28.5],[88,27.5],[89,26.7],[92,27],[95,28.5],[97,28],[95,26],[94,24],[93,22],[91,24.5],[89,25],[88.5,22.5],[87,21.5],[85,19.5],[83,17.5],[80.3,15.5],[80.2,13],[79.8,10.5],[78.2,8.7],[77.5,8],[76.5,9],[75.5,11.5],[74.8,13.5],[73.8,16],[72.8,19],[72.9,21],[70.5,21],[69,22.3],[68.2,23.7],[70,24.5],[71,25.5],[70.5,28],[72,29.5],[74,31],[74.5,33],[73.5,34.5]];
const SEED=[{w:"Ravi M.",s:"Support",t:"This will cut my daily commute. Please keep the cycle lane.",r:[{w:"Project owner, Urban Development Dept.",b:"Government response",t:"The cycle lane stays in the approved design."}]},{w:"Meera S.",s:"Concern",t:"What happens to the existing trees along the route?",r:[{w:"Lead planner",b:"Project planner",t:"The plan retains most trees and adds replanting along the edge."}]},{w:"Joseph K.",s:"Neutral",t:"When will the traffic diversion plan be published?",r:[]}];
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=c=>'₹'+c.toLocaleString('en-IN')+' Cr',ppl=p=>p.s[0]+p.s[1]+p.s[2],cats=['All','Road','Hospital','School','Stadium','Mall','Park'];
let user=false,cat='All',sort='talk',past=false,q='',back=null;const fol=new Set(),CM=D.map(()=>SEED.map(c=>({...c})));
(function(){const cv=$('#stars'),cx=cv.getContext('2d'),N=260,Z=1000;let W,H,S=[];const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
function sz(){const d=devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight}
const mk=f=>({x:(Math.random()-.5)*2*W,y:(Math.random()-.5)*2*H,z:f?Math.random()*Z:Z});
function dr(){cx.clearRect(0,0,W,H);for(const s of S){const pz=s.z;if(!calm)s.z-=1.1;if(s.z<=1){Object.assign(s,mk());continue}
const k=500/s.z,x=W/2+s.x*k*.5,y=H/2+s.y*k*.5,pk=500/pz,a=Math.min(1,(1-s.z/Z)*1.4+.1);
if(x<-20||x>W+20||y<-20||y>H+20){Object.assign(s,mk());continue}
cx.strokeStyle=`rgba(190,235,255,${a*.5})`;cx.beginPath();cx.moveTo(W/2+s.x*pk*.5,H/2+s.y*pk*.5);cx.lineTo(x,y);cx.stroke();
cx.fillStyle=`rgba(190,235,255,${a})`;cx.beginPath();cx.arc(x,y,Math.max(.4,(1-s.z/Z)*2),0,6.283);cx.fill()}
if(!calm)requestAnimationFrame(dr)}
addEventListener('resize',sz);sz();S=Array.from({length:N},()=>mk(true));dr()})();
const px=p=>[(p.lng-68)*13+20,(37.5-p.lat)*13+10];
function india(list,hi,cls,labels){const o=OUT.map(([a,b])=>px({lng:a,lat:b}).join(',')).join(' ');
return `<svg class="mp ${cls||''}" id="mp" viewBox="0 0 420 430" role="img" aria-label="Map of India with project pins"><polygon class="in" points="${o}"/>`+list.map(p=>{const i=D.indexOf(p),[x,y]=px(p),c=i===hi?'var(--no)':`hsl(${185+p.h%50},85%,66%)`;
return `<g class="pin" tabindex="0" role="button" data-i="${i}" aria-label="${esc(p.n)}, ${p.city}"><circle class="d" cx="${x}" cy="${y}" r="6" fill="${c}"/><circle cx="${x}" cy="${y}" r="12" fill="none" stroke="${c}" opacity=".4"/>${labels?`<text x="${x+10}" y="${y+4}">${p.city}</text>`:''}</g>`}).join('')+'</svg>'}
const sbar=p=>`<div class="sb" role="img" aria-label="Support ${p.s[0]}, concern ${p.s[1]}, neutral ${p.s[2]} people"><i class="su" style="flex:${p.s[0]}"></i><i class="co" style="flex:${p.s[1]}"></i><i class="ne" style="flex:${p.s[2]}"></i></div>`;
const grid=$('#grid'),view=$('#view');
function list(){let l=D.filter(p=>(past?p.st>1:p.st<2)&&(cat==='All'||p.cat===cat)&&(!q||(p.n+' '+p.city+' '+p.cat).toLowerCase().includes(q)));
return l.sort((a,b)=>sort==='talk'?ppl(b)-ppl(a):sort==='new'?D.indexOf(b)-D.indexOf(a):(a.days||999)-(b.days||999))}
function render(){const l=list(),open=D.filter(p=>p.st===0);
$('#strip').innerHTML=`<span><b>${open.length}</b> open for response</span><span><b>${new Set(D.map(p=>p.city)).size}</b> cities</span><span><b>${D.reduce((a,p)=>a+ppl(p),0).toLocaleString('en-IN')}</b> people have taken part</span>`;
$('#bar').innerHTML=cats.map(c=>`<button class="chip" data-cat="${c}" aria-pressed="${c===cat}">${c==='All'?'All types':c}</button>`).join('')+`<select id="so" aria-label="Sort projects"><option value="talk">Most discussed</option><option value="new">Newest</option><option value="soon">Closing soon</option></select><div class="seg"><button data-past="0" aria-pressed="${!past}">Open now</button><button data-past="1" aria-pressed="${past}">Past projects</button></div>`;$('#so').value=sort;
let h=`<article class="card big" tabindex="0" role="button" data-map aria-label="Open map of India">${india(l.length?l:D,-1,'',false).replace('class="mp ','class="').replace('id="mp"','')}<span class="tag">Map</span><h3>India map</h3><p>${l.length} project${l.length===1?'':'s'} shown. Open the map to search places.</p></article>`;
h+=l.map(p=>{const i=D.indexOf(p);return `<article class="card" tabindex="0" role="button" data-i="${i}" aria-label="${esc(p.n)}"><div class="art" style="background:radial-gradient(circle at 85% 12%,hsla(${185+p.h%50},85%,58%,.38),transparent 62%)"></div><span class="tag">${p.cat}</span><button class="fol" data-act="follow" data-i="${i}" aria-pressed="${fol.has(i)}">${fol.has(i)?'Following':'Follow'}</button><h3>${esc(p.n)}</h3><p>${p.city} · ${inr(p.cr)}</p>${sbar(p)}<div class="meta"><span>${ppl(p).toLocaleString('en-IN')} people</span><span>${p.st===3?'Halted':p.st===2?'Completed':p.st===1?'In progress':p.days+' days left'}</span></div></article>`}).join('');
if(!l.length)h+=`<div class="empty">${q?`No projects found for “${esc(q)}”. The live site will also search within 10 km of any place you type.`:'No projects match these filters. Try another type.'}</div>`;grid.innerHTML=h}
const X='<button class="close" aria-label="Close">✕</button>';
function cms(i){return CM[i].map(c=>`<div class="cm"><b>${esc(c.w)}</b> <small>${c.s}</small><div>${esc(c.t)}</div>${(c.r||[]).map(r=>`<div class="rp"><b>${esc(r.w)}</b><span class="bd ${r.b==='Project planner'?'pl':''}">${r.b}</span><div>${esc(r.t)}</div></div>`).join('')}</div>`).join('')}
function det(i){const p=D[i],t=ppl(p),pc=v=>Math.round(v/t*100),S=['Open for response','In progress','Completed'];
const trk=p.st===3?`<div class="halt"><b>Halted.</b> ${esc(p.why)}</div>`:`<ol class="trk">${S.map((s,k)=>`<li class="${k<p.st?'dn':k===p.st?'on':''}">${s}</li>`).join('')}</ol>`;
return `<div class="panel">${X}<h2>${esc(p.n)}</h2><p class="sub">${p.cat} · ${p.city}</p>${trk}
<div class="stats"><div class="stat"><b>${inr(p.cr)}</b><span>Budget</span></div><div class="stat"><b>${p.st===0?p.days:'–'}</b><span>Days left to respond</span></div><div class="stat"><b>${t.toLocaleString('en-IN')}</b><span>People took part</span></div></div>
<div class="sec"><h4>What people think</h4>${sbar(p)}<div class="lg"><span>Support ${pc(p.s[0])}%</span><span>Concern ${pc(p.s[1])}%</span><span>Neutral ${pc(p.s[2])}%</span></div></div>
<div class="sec"><h4>About this project</h4><p style="margin:0">${esc(p.d)}</p><p style="margin:12px 0 0"><button class="btn" data-act="follow" data-i="${i}" aria-pressed="${fol.has(i)}">${fol.has(i)?'Following':'Follow this project'}</button></p></div>
<div class="sec"><h4>Location <span class="seg" style="display:inline-flex;margin-left:10px"><button data-act="mode" data-m="" aria-pressed="true">Simple</button><button data-act="mode" data-m="sat" aria-pressed="false">Satellite</button></span></h4>${india([p],i,'',true).replace('data-i=','data-x=')}</div>
<div class="sec"><h4>Comments</h4><div id="cl">${cms(i)}</div>${user?`<select id="cs" aria-label="Your stance"><option>Support</option><option>Concern</option><option>Neutral</option></select><textarea class="field" id="ct" rows="3" maxlength="500" placeholder="Share your view (3 to 500 characters)"></textarea><div class="err" id="ce" role="alert"></div><button class="btn" data-act="post" data-i="${i}">Post comment</button>`:`<p class="note">Anyone can read comments. Log in to comment or reply.</p><button class="btn" data-act="login" data-i="${i}">Log in to comment</button>`}</div></div>`}
function login(tab){return `<div class="panel" style="max-width:440px">${X}<h2>${tab==='r'?'Create account':'Log in'}</h2><p class="sub">${tab==='r'?'New accounts start as Citizen.':'Log in to follow projects and comment.'}</p><div class="tabs"><button class="chip" data-act="tab" data-t="l" aria-pressed="${tab!=='r'}">Log in</button><button class="chip" data-act="tab" data-t="r" aria-pressed="${tab==='r'}">Register</button></div>${tab==='r'?'<input class="field" id="fn" placeholder="Full name" aria-label="Full name" autocomplete="name">':''}<input class="field" id="fe" type="email" placeholder="Email" aria-label="Email" autocomplete="email"><input class="field" id="fp" type="password" placeholder="Password (8+ characters)" aria-label="Password"><div class="err" id="fr" role="alert"></div><button class="btn" style="width:100%" data-act="go" data-t="${tab||'l'}">${tab==='r'?'Create account':'Log in'}</button></div>`}
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches,dur=n=>calm?1:n,EASE='cubic-bezier(.65,0,.2,1)',FULL='inset(0px 0px 0px 0px round 20px)';let origin=null,closing=false;
const clip=(F,C)=>`inset(${C.top-F.top}px ${F.right-C.right}px ${F.bottom-C.bottom}px ${C.left-F.left}px round 16px)`;
function fly(sel){grid.classList.add('fly');const cx=innerWidth/2,cy=innerHeight/2;[...grid.children].forEach(c=>{if(c===sel)return;const b=c.getBoundingClientRect(),dx=(b.left+b.width/2-cx)*.9,dy=(b.top+b.height/2-cy)*.9;c.style.transform=`translate3d(${dx}px,${dy}px,900px) rotateY(${dx/60}deg)`;c.style.opacity=0})}
function release(){grid.classList.remove('fly');[...grid.children].forEach(c=>{c.style.transform='';c.style.opacity=''})}
function finish(){closing=false;view.getAnimations().forEach(a=>a.cancel());view.classList.remove('on');view.innerHTML='';if(origin){origin.style.visibility='';origin=null}}
function closeView(){if(!view.classList.contains('on')||closing)return;const pn=view.querySelector('.panel');release();if(!origin||!pn||!origin.isConnected){finish();return}closing=true;
const F=pn.getBoundingClientRect(),C=origin.getBoundingClientRect();view.animate([{opacity:1},{opacity:0}],{duration:dur(900),fill:'forwards'});pn.animate([{clipPath:FULL},{clipPath:clip(F,C)}],{duration:dur(900),easing:EASE,fill:'forwards'}).onfinish=finish}
function openV(html,sel){view.innerHTML=html;view.classList.add('on');if(!sel){origin=null;view.querySelector('.field,.close').focus();return}origin=sel;fly(sel);const pn=view.querySelector('.panel'),F=pn.getBoundingClientRect(),C=sel.getBoundingClientRect();sel.style.visibility='hidden';
view.animate([{opacity:0},{opacity:1}],{duration:dur(700)});pn.animate([{clipPath:clip(F,C)},{clipPath:FULL}],{duration:dur(1200),easing:EASE});[...pn.children].forEach(k=>k.animate([{opacity:0},{opacity:0,offset:.45},{opacity:1}],{duration:dur(1200)}));pn.querySelector('.close').focus()}
function swap(html){view.innerHTML=html;const f=view.querySelector('.field,.close');f&&f.focus()}
function chrome(){$('#guest').hidden=user;$('#me').hidden=!user}
function msgs(){return `<div class="panel" style="max-width:520px">${X}<h2>Messages</h2><p class="sub">Updates from projects you follow.</p><div class="cm"><b>Marine Drive Link Road</b><div>Moved to In progress.</div></div><div class="cm"><b>Government response</b><div>The owning official replied to your comment on Community Clinic.</div></div></div>`}
grid.addEventListener('click',e=>{const f=e.target.closest('.fol');if(f){e.stopPropagation();act(f);return}const c=e.target.closest('.card');if(!c)return;c.blur();c.hasAttribute('data-map')?openV(`<div class="panel">${X}<h2>India map</h2><p class="sub">Select a pin to open a project.</p>${india(D,-1,'',true)}<p class="note">Schematic preview. The live site uses a real map with Simple and Satellite views and place search.</p></div>`,c):openV(det(+c.dataset.i),c)});
grid.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('card'))e.target.click()});
function act(b){const a=b.dataset.act,i=+b.dataset.i;
if(a==='follow'){if(!user){back=view.classList.contains('on')?i:null;openOrSwap(login());return}fol.has(i)?fol.delete(i):fol.add(i);const on=fol.has(i);document.querySelectorAll(`[data-act=follow][data-i="${i}"]`).forEach(x=>{x.setAttribute('aria-pressed',on);x.textContent=x.classList.contains('fol')?(on?'Following':'Follow'):(on?'Following':'Follow this project')})}
else if(a==='login'){back=isNaN(i)?null:i;openOrSwap(login())}
else if(a==='tab')swap(login(b.dataset.t));
else if(a==='msgs')openV(msgs());
else if(a==='out'){user=false;chrome()}
else if(a==='mode'){const m=$('#mp');m.classList.toggle('sat',!!b.dataset.m);b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))}
else if(a==='go'){const e=$('#fe').value.trim(),p=$('#fp').value,n=$('#fn'),er=$('#fr');let m='';
if(n&&!/^[A-Za-z][A-Za-z .'-]{1,59}$/.test(n.value.trim()))m='Name must use letters only (2 to 60 characters).';
else if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e))m='Enter a valid email address.';else if(p.length<8)m='Password needs at least 8 characters.';
if(m){er.textContent=m;return}user=true;chrome();back!==null?swap(det(back)):closeView()}
else if(a==='post'){const t=$('#ct').value.trim();if(t.length<3||t.length>500){$('#ce').textContent='Write between 3 and 500 characters.';return}
CM[i].unshift({w:'Anita R.',s:$('#cs').value,t,r:[]});$('#cl').innerHTML=cms(i);$('#ct').value='';$('#ce').textContent=''}}
function openOrSwap(h){view.classList.contains('on')?swap(h):openV(h)}
view.addEventListener('click',e=>{if(e.target.closest('.close')||e.target===view){closeView();return}const b=e.target.closest('[data-act]');if(b){act(b);return}const pin=e.target.closest('.pin[data-i]');if(pin)swap(det(+pin.dataset.i))});
view.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('pin'))e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))});
addEventListener('keydown',e=>{if(e.key==='Escape')closeView()});
$('#bar').addEventListener('click',e=>{const c=e.target.closest('[data-cat]'),s=e.target.closest('[data-past]');if(c)cat=c.dataset.cat;else if(s)past=s.dataset.past==='1';else return;render()});
$('#bar').addEventListener('change',e=>{if(e.target.id==='so'){sort=e.target.value;render()}});
$('#q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render()});
document.addEventListener('click',e=>{const b=e.target.closest('header [data-act]');if(b)act(b)});
$('#th').addEventListener('click',()=>{const r=document.documentElement,l=getComputedStyle(r).colorScheme==='light';r.dataset.theme=l?'dark':'light';try{localStorage.setItem('tn-theme',r.dataset.theme)}catch(_){}});
try{const t=localStorage.getItem('tn-theme');if(t)document.documentElement.dataset.theme=t}catch(_){}
chrome();render();
</script>
</body>
</html>
