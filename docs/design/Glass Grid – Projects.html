<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glass Grid – Projects</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap">
<style>
:root{--bg:#16121f;--glow1:#4b2b82;--glow2:#3a3944;--text:#f2eefa;--muted:#b5accb;--glass:rgba(84,70,110,.30);--edge:rgba(255,255,255,.16);--accent:#c4a8ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:'Sora',system-ui,sans-serif;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.45;z-index:0;pointer-events:none}
body:before{background:var(--glow1);top:-25vmax;left:-15vmax;opacity:.55}
body:after{background:var(--glow2);bottom:-30vmax;right:-20vmax;opacity:.6}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
header{position:relative;z-index:5;display:flex;gap:16px;align-items:center;padding:20px clamp(16px,4vw,48px)}
.logo{font-weight:600;letter-spacing:.02em;white-space:nowrap}
.search{flex:1;max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:0 18px;height:46px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(18px)}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:14px}
.search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
button{font:inherit;color:inherit;cursor:pointer}
.login{height:46px;padding:0 24px;border-radius:999px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent);backdrop-filter:blur(14px)}
.login:hover,.login:focus-visible{background:color-mix(in srgb,var(--accent) 30%,transparent);outline:0}
main{position:relative;z-index:1;padding:8px clamp(16px,4vw,48px) 40px;perspective:1400px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:minmax(150px,19vh);gap:18px;max-width:1500px;margin:0 auto;transform-style:preserve-3d}
.card{position:relative;border-radius:14px;padding:18px;text-align:left;background:linear-gradient(145deg,var(--glass),rgba(255,255,255,.02));border:1px solid var(--edge);backdrop-filter:blur(20px) saturate(140%);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 18px 40px -20px rgba(0,0,0,.6);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;transition:transform 2.2s cubic-bezier(.45,0,.2,1),scale .35s ease,opacity 1.6s ease-in,border-color .2s,box-shadow .2s;will-change:transform}
.card:hover,.card:focus-visible{border-color:var(--accent);outline:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 28px -6px var(--accent)}
@media (hover:hover) and (pointer:fine){.card:hover{scale:1.045;z-index:2}}
@media (hover:none){.card:active{scale:1.045;z-index:2}}
.card.dim{opacity:.18;pointer-events:none}
.card .art{position:absolute;inset:0;opacity:.8;z-index:-1}
.card h3{margin:0;font-size:16px;font-weight:600}
.card p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.chip{position:absolute;top:14px;right:14px;font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--edge);background:rgba(20,16,30,.55)}
.seg-row{display:flex;margin-top:10px;padding-top:8px;border-top:1px solid var(--edge);font-size:12px;color:var(--muted)}
.seg-row span+span{margin-left:10px;padding-left:10px;border-left:1px solid var(--edge)}
.mini{height:4px;border-radius:4px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
.mini i{display:block;height:100%;background:linear-gradient(90deg,#7c4dff,#c4a8ff)}
.segs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:0 0 20px}
.seg{margin:0;padding:16px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--edge)}
.seg.wide{grid-column:span 2}
.seg h4{margin:0 0 12px;font-size:13px;font-weight:400;color:var(--muted)}
.seg .bar{margin:0 0 12px}.seg .tags{margin:0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;font-size:14px;border-top:1px solid var(--edge)}
.kv:first-of-type{border-top:0}.kv span{color:var(--muted)}.kv b{font-weight:600}
.big{grid-column:span 2;grid-row:span 2;padding:26px}
.big h3{font-size:26px;font-weight:300}
.big p{font-size:14px}
.big svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.fly .card{pointer-events:none}
.view{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) 20px max(20px,env(safe-area-inset-bottom,0px));perspective:1400px;background:radial-gradient(circle at 50% 50%,rgba(16,12,24,.2),rgba(16,12,24,.82))}
.view.on{display:flex}
.panel{width:min(1100px,100%);max-height:100%;overflow:auto;border-radius:18px;padding:28px;background:linear-gradient(145deg,rgba(66,46,104,.78),rgba(34,33,42,.9));color:#f2eefa;border:1px solid var(--edge);backdrop-filter:blur(30px);box-shadow:0 40px 120px -20px rgba(0,0,0,.8),0 0 60px -20px var(--accent);animation:come 1.6s cubic-bezier(.15,.7,.2,1) both}
@keyframes come{from{transform:translateZ(-1400px) scale(.5);opacity:0}to{transform:none;opacity:1}}
.panel h2{margin:0 0 6px;font-weight:300;font-size:clamp(24px,3vw,38px)}
.panel .sub{color:#b5accb;margin:0 0 20px;font-size:14px}
.close{float:right;width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:rgba(255,255,255,.06)}
.close:hover,.close:focus-visible{border-color:var(--accent);outline:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:0}
.stat{padding:2px 16px;border-left:1px solid var(--edge)}.stat:first-child{padding-left:0;border-left:0}
.stat b{display:block;font-size:24px;font-weight:600}
.stat span{font-size:12px;color:#b5accb}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden;margin:6px 0 18px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c4dff,#c4a8ff);border-radius:8px}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.tags span{font-size:12px;padding:5px 12px;border-radius:999px;border:1px solid var(--edge)}
.cta{padding:12px 24px;border-radius:999px;border:1px solid var(--accent);background:color-mix(in srgb,var(--accent) 20%,transparent)}
.map{width:100%;aspect-ratio:16/9;border-radius:10px;background:#120d1c;display:block;border:1px solid var(--edge)}
.pin{cursor:pointer}.pin:hover circle.d,.pin:focus circle.d{r:10}
.field{display:block;width:100%;margin:10px 0;height:46px;border-radius:14px;border:1px solid var(--edge);background:rgba(255,255,255,.06);color:#f2eefa;padding:0 14px;font:inherit}
@media (max-width:900px){.grid{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px}.logo{display:none}}
@media (max-width:560px){header{flex-wrap:wrap}.segs{grid-template-columns:1fr}.seg.wide{grid-column:auto}.stats{grid-template-columns:1fr}.stat{padding:8px 0;border-left:0}.big{grid-column:span 2}}
@media (prefers-reduced-motion:reduce){.card,.panel{transition:none;animation:none}}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<header>
  <div class="logo">Glass Grid</div>
  <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Search projects" aria-label="Search projects"></label>
  <button class="login" id="loginBtn">Log in</button>
</header>
<main><div class="grid" id="grid"></div></main>
<div class="view" id="view" role="dialog" aria-modal="true"></div>

<script>
const P=[
["Aurora Tower","Residential",72,"$48M","14 floors",265],["Helix Bridge","Infrastructure",41,"$120M","2.1 km",200],
["Nova Campus","Education",88,"$32M","9 blocks",310],["Pulse Arena","Sports",23,"$210M","60k seats",20],
["Lumen Library","Culture",95,"$18M","4 floors",45],["Vertex Labs","Research",57,"$64M","6 labs",180],
["Tidewater Port","Logistics",34,"$150M","12 berths",190],["Orbit Mall","Retail",66,"$85M","180 shops",330],
["Terra Park","Green space",80,"$9M","22 ha",140],["Skyline Metro","Transit",48,"$300M","7 stations",235],
["Ember Plant","Energy",15,"$410M","800 MW",15],["Cobalt Clinic","Healthcare",62,"$27M","120 beds",215]];

// Starfield: stars drift slowly toward the camera; speed rises gently while cards fly in
(function(){
  const cv=document.getElementById('stars'),cx=cv.getContext('2d'),N=420,DEPTH=1000;
  const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,stars=[],speed=1.1,target=1.1,color='240,232,255';
  function size(){const d=devicePixelRatio||1;W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0);W=innerWidth;H=innerHeight;
    }
  function make(first){return{x:(Math.random()-.5)*2*W,y:(Math.random()-.5)*2*H,z:first?Math.random()*DEPTH:DEPTH,h:Math.random()}}
  function init(){size();stars=Array.from({length:N},()=>make(true))}
  function draw(){
    speed+=(target-speed)*.02;
    cx.clearRect(0,0,W,H);
    for(const s of stars){
      const pz=s.z; if(!calm)s.z-=speed;
      if(s.z<=1){Object.assign(s,make(false));continue}
      const k=500/s.z,x=W/2+s.x*k*.5,y=H/2+s.y*k*.5;
      if(x<-20||x>W+20||y<-20||y>H+20){Object.assign(s,make(false));continue}
      const pk=500/pz,px=W/2+s.x*pk*.5,py=H/2+s.y*pk*.5;
      const a=Math.min(1,(1-s.z/DEPTH)*1.4+.1),r=Math.max(.4,(1-s.z/DEPTH)*2.2);
      cx.strokeStyle=`rgba(${color},${a*.55})`;cx.lineWidth=r*.8;
      cx.beginPath();cx.moveTo(px,py);cx.lineTo(x,y);cx.stroke();
      cx.fillStyle=`rgba(${color},${a})`;cx.beginPath();cx.arc(x,y,r,0,6.283);cx.fill();
    }
    if(!calm)requestAnimationFrame(draw)
  }
  addEventListener('resize',size);init();draw();
  window.starBoost=v=>{target=v};
})();
const grid=document.getElementById('grid'),view=document.getElementById('view');
let html=`<button class="card big" data-map aria-label="Open map view"><svg viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice"><g stroke="rgba(196,168,255,.22)" fill="none"><path d="M0 60H400M0 130H400M0 210H400M70 0V300M160 0V300M250 0V300M340 0V300"/><path d="M0 250L120 140L220 190L400 40" stroke="#c4a8ff" stroke-width="2"/></g><circle cx="120" cy="140" r="6" fill="#e6dcff"/><circle cx="220" cy="190" r="6" fill="#9b6dff"/><circle cx="330" cy="70" r="6" fill="#c4a8ff"/></svg><span class="chip">Map</span><h3>Project map</h3><div class="seg-row"><span>12 projects</span><span>Open map view</span></div></button>`;
P.forEach((p,i)=>{html+=`<button class="card" data-i="${i}" data-name="${(p[0]+' '+p[1]).toLowerCase()}"><div class="art" style="background:radial-gradient(circle at 85% 10%,hsla(${250+p[5]%60},80%,62%,.35),transparent 60%)"></div><span class="chip">${p[1]}</span><h3>${p[0]}</h3><div class="seg-row"><span>${p[3]}</span><span>${p[4]}</span><span>${p[2]}%</span></div><div class="mini"><i style="width:${p[2]}%"></i></div></button>`});
grid.innerHTML=html;

function fly(sel){ // cards come toward the viewer, then details appear
  const cards=[...grid.children],r=sel.getBoundingClientRect(),cx=innerWidth/2,cy=innerHeight/2;
  grid.classList.add('fly');window.starBoost&&starBoost(4);
  cards.forEach(c=>{if(c===sel)return;const b=c.getBoundingClientRect(),dx=(b.left+b.width/2-cx)*.9,dy=(b.top+b.height/2-cy)*.9;
    c.style.transform=`translate3d(${dx}px,${dy}px,900px) rotateY(${dx/60}deg)`;c.style.opacity=0});
}
let origin=null;
const EASE='cubic-bezier(.65,0,.2,1)',calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
const dur=n=>calm?1:n;
function clipFrom(F,C){return `inset(${C.top-F.top}px ${F.right-C.right}px ${F.bottom-C.bottom}px ${C.left-F.left}px round 14px)`}
const FULL='inset(0px 0px 0px 0px round 18px)';
function release(){window.starBoost&&starBoost(1.1);grid.classList.remove('fly');[...grid.children].forEach(c=>{c.style.transform='';c.style.opacity=''})}
let closing=false;
function finish(){closing=false;view.getAnimations().forEach(a=>a.cancel());view.classList.remove('on');view.innerHTML='';if(origin){origin.style.visibility='';origin=null}}
function closeView(){
  if(!view.classList.contains('on')||closing)return;
  const panel=view.querySelector('.panel');release();
  if(!origin||!panel){finish();return}
  closing=true;
  const F=panel.getBoundingClientRect(),C=origin.getBoundingClientRect();
  [...panel.children].forEach(k=>k.animate([{opacity:1},{opacity:0}],{duration:dur(350),fill:'forwards'}));
  view.animate([{opacity:1},{opacity:0}],{duration:dur(1200),fill:'forwards'});
  panel.animate([{clipPath:FULL},{clipPath:clipFrom(F,C)}],{duration:dur(1200),easing:EASE,fill:'forwards'}).onfinish=finish;
}
// the detail page grows out of the clicked card
function open(content,sel){
  origin=sel;fly(sel);
  view.innerHTML=content;view.classList.add('on');
  const panel=view.querySelector('.panel');panel.style.animation='none';
  const F=panel.getBoundingClientRect(),C=sel.getBoundingClientRect();
  sel.style.visibility='hidden';
  view.animate([{opacity:0},{opacity:1}],{duration:dur(900)});
  panel.animate([{clipPath:clipFrom(F,C)},{clipPath:FULL}],{duration:dur(1600),easing:EASE});
  [...panel.children].forEach(k=>k.animate([{opacity:0},{opacity:0,offset:.45},{opacity:1}],{duration:dur(1600)}));
  panel.querySelector('.close').focus();
}
function swap(content){
  view.innerHTML=content;const panel=view.querySelector('.panel');panel.style.animation='none';
  [...panel.children].forEach(k=>k.animate([{opacity:0},{opacity:1}],{duration:dur(700)}));
  panel.querySelector('.close').focus();
}
const X='<button class="close" aria-label="Close">✕</button>';
function detail(i){const p=P[i],ph=Math.ceil(p[2]/34);return `<div class="panel">${X}<h2>${p[0]}</h2><p class="sub">${p[1]} project</p>
<div class="segs">
<section class="seg wide"><h4>Budget and scale</h4><div class="stats"><div class="stat"><b>${p[3]}</b><span>Budget</span></div><div class="stat"><b>${p[4]}</b><span>Scale</span></div><div class="stat"><b>${p[2]}%</b><span>Complete</span></div></div></section>
<section class="seg"><h4>Progress</h4><div class="bar"><i style="width:${p[2]}%"></i></div><div class="kv"><span>Phase</span><b>${ph} of 3</b></div><div class="kv"><span>Complete</span><b>${p[2]}%</b></div></section>
<section class="seg"><h4>Details</h4><div class="kv"><span>Category</span><b>${p[1]}</b></div><div class="kv"><span>Budget</span><b>${p[3]}</b></div><div class="kv"><span>Scale</span><b>${p[4]}</b></div></section>
</div><button class="cta">View full report</button></div>`}
function mapView(){const pos=[[90,60],[150,170],[250,90],[330,200],[420,70],[480,160],[110,250],[300,260],[400,230],[560,90],[600,230],[520,260]];
let s='<svg class="map" viewBox="0 0 680 320" role="img" aria-label="Project map"><g stroke="rgba(196,168,255,.2)" fill="none"><path d="M0 70H680M0 150H680M0 240H680M80 0V320M200 0V320M320 0V320M440 0V320M560 0V320"/><path d="M0 280L150 170L330 210L520 100L680 40" stroke="#c4a8ff" stroke-width="2.5"/><path d="M60 0L250 90L400 70L560 90" stroke="#8f8aa3" stroke-width="2"/></g>';
P.forEach((p,i)=>{s+=`<g class="pin" tabindex="0" role="button" data-i="${i}" aria-label="${p[0]}"><circle class="d" cx="${pos[i][0]}" cy="${pos[i][1]}" r="7" fill="hsl(${250+p[5]%60},85%,70%)"/><circle cx="${pos[i][0]}" cy="${pos[i][1]}" r="14" fill="none" stroke="hsl(${250+p[5]%60},85%,70%)" opacity=".4"/><text x="${pos[i][0]+14}" y="${pos[i][1]+4}" fill="#e9e2fa" font-size="11">${p[0]}</text></g>`});
const avg=Math.round(P.reduce((a,p)=>a+p[2],0)/P.length);
return `<div class="panel">${X}<h2>Project map</h2><p class="sub">Select a pin to open its details</p>${s}</svg>
<div class="segs" style="margin-top:14px"><section class="seg"><h4>Projects</h4><div class="kv"><span>On the map</span><b>${P.length}</b></div></section><section class="seg"><h4>Progress</h4><div class="kv"><span>Average complete</span><b>${avg}%</b></div></section></div></div>`}

grid.addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;c.blur();
  if(c.hasAttribute('data-map'))open(mapView(),c);else open(detail(+c.dataset.i),c)});
view.addEventListener('click',e=>{
  if(e.target.closest('.close')||e.target===view){closeView();return}
  const pin=e.target.closest('.pin');if(pin)swap(detail(+pin.dataset.i))});
view.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('pin'))e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))});
addEventListener('keydown',e=>{if(e.key==='Escape'&&view.classList.contains('on'))closeView()});
document.getElementById('q').addEventListener('input',e=>{const v=e.target.value.trim().toLowerCase();
  grid.querySelectorAll('.card[data-name]').forEach(c=>c.classList.toggle('dim',!!v&&!c.dataset.name.includes(v)))});
document.getElementById('loginBtn').addEventListener('click',e=>{
  origin=null;
  view.innerHTML=`<div class="panel" style="max-width:420px">${X}<h2>Log in</h2><p class="sub">Access your projects</p><input class="field" placeholder="Email" type="email" aria-label="Email"><input class="field" placeholder="Password" type="password" aria-label="Password"><button class="cta" style="width:100%;margin-top:8px">Log in</button></div>`;
  view.classList.add('on');view.querySelector('.field').focus()});
</script>
</body>
</html>
